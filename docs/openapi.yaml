openapi: 3.0.3
info:
  title: Enterprise RAG Platform API
  version: "1.0.0"
  description: >
    Internal knowledge assistant API. Employees upload company documents and
    ask natural-language questions; the API returns answers grounded in and
    cited to the source documents.
servers:
  - url: /api/v1

paths:
  /documents/upload:
    post:
      summary: Upload a document for ingestion
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Accepted — ingestion runs asynchronously
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"

  /documents:
    get:
      summary: List uploaded documents
      operationId: listDocuments
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated list of documents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/DocumentResponse"

  /documents/{id}:
    get:
      summary: Get a single document's metadata
      operationId: getDocument
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Document metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a document and its vectors/chunks
      operationId: deleteDocument
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Error"

  /documents/{id}/status:
    get:
      summary: Poll ingestion status
      operationId: getDocumentStatus
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "200":
          description: Current ingestion status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStatusResponse"
        "404":
          $ref: "#/components/responses/Error"

  /search:
    post:
      summary: Ask a question, get a cited answer
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Answer with citations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"

  /search/history:
    get:
      summary: List past search queries
      operationId: getSearchHistory
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated search history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paginated"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/SearchHistoryItem"

components:
  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0

  responses:
    Error:
      description: Structured error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    DocumentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        original_name: { type: string }
        file_type: { type: string, enum: [pdf, docx, txt, md] }
        file_size: { type: integer }
        status: { type: string, enum: [pending, processing, ready, failed] }
        chunk_count: { type: integer }
        error_message: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    DocumentStatusResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, processing, ready, failed] }
        error_message: { type: string, nullable: true }

    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1, maxLength: 2000 }
        top_k: { type: integer, default: 5, minimum: 1, maximum: 20 }

    Citation:
      type: object
      properties:
        chunk_index: { type: integer }
        document_name: { type: string }
        page_number: { type: integer, nullable: true }
        text: { type: string }
        chroma_id: { type: string }

    SearchResponse:
      type: object
      properties:
        search_id: { type: string, format: uuid }
        query: { type: string }
        answer: { type: string }
        mode: { type: string, enum: [answered, related_docs] }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        latency_ms: { type: integer }
        token_count: { type: integer, nullable: true }

    SearchHistoryItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        query: { type: string }
        answer: { type: string, nullable: true }
        latency_ms: { type: integer, nullable: true }
        feedback: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    Paginated:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: "DOCUMENT_NOT_FOUND" }
            message: { type: string }
            details: { type: object, nullable: true }
